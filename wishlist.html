<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wishlist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/wishlist.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">EZ-Shop</a>
            <div class="d-flex align-items-center">
                <a href="../HTML/shopingCart.html" class="text-white me-3 position-relative">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount"></span>
                </a>
                <a href="../HTML/wishlist.html" class="text-white position-relative">
                    <i class="fas fa-heart fa-lg"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="wishlistCount"></span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Special Offer Banner -->
<div class="special-offer-banner">
    <div class="offer-content">
        <i class="fas fa-gift me-2"></i> 
        <span class="offer-text">SPECIAL OFFER: Buy one item and get 20% off on another item!</span>
        <i class="fas fa-tag offer-icon"></i>
    </div>
</div>

    <!-- Wishlist Container -->
    <div class="wishlist-container">

        <!-- Wishlist Items Grid -->
        <div class="wishlist-grid" id="wishlistItemsContainer">
            <!-- Items will be dynamically inserted here -->
        </div>

        <!-- Empty Wishlist Message -->
        <div class="empty-wishlist" id="emptyWishlistMessage" style="display: none;">
            <i class="fas fa-heart-broken"></i>
            <h3>Your wishlist is empty</h3>
            <p>Start adding items you love!</p>
            <a href="../HTML/products.html" class="btn btn-primary mt-3">Continue Shopping</a>
        </div>
    </div>

<script src="../JS/wishlist.js"></script>
</body>
</html>
