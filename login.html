<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style.css">
    <title>Login - EZ-Shop</title>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" name="loginEmail" required placeholder="Enter your email">
                <div class="error" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="loginPassword" required placeholder="Enter your password">
                <div class="error" id="passwordError"></div>
            </div>

            <div class="forgot-password">
                <a href="forgetpass.html">Forgot password?</a>
            </div>
            
            <button type="submit" id="loginButton">Login</button>
            
            <div class="register-link">
                Don't have an account? <a href="index.html">Register here</a>
            </div>
        </form>
    </div>
    <script src="./JS/login.js"></script>
</body>
</html>
